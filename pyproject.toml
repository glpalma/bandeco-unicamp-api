[project]
name = "bandeco-unicamp-api"
version = "0.1.0"
description = "REST API for Unicamp's university restaurant (bandeco) daily menu"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "sqlmodel>=0.0.37",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "apscheduler>=3.10",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.13.1",
]

[project.scripts]
serve = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
